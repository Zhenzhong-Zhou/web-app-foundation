name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        # The plugin's steps are subagents. Run in the background, one is
        # lost when the run ends, since the action stops at Claude's first
        # result (#252); in the foreground, the run waits for each.
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: '1'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # The plugin's own allowed-tools again, here for the whole run: its
          # grant lasts the turn that runs the command, and nothing says it
          # reaches the subagents its steps launch, which inherit these
          # (#252; the action's own review examples list them too).
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,
            Bash(gh issue view:*), Bash(gh search:*), Bash(gh issue list:*),
            Bash(gh pr comment:*), Bash(gh pr diff:*), Bash(gh pr view:*),
            Bash(gh pr list:*)"
            --append-system-prompt "Review the pull request's diff as it
            stands now, and finish every step of the review in this run.
            Never wait for the pull request's checks, CI or other workflow
            runs, and never end by saying you will continue later: nothing
            returns to this run once it ends. Post the review, or say on the
            pull request that there is nothing to flag, before ending."
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      # The action reports success even when it posted nothing, as when it
      # ran out of usage on #227, #228, #235 and #236 (#243), or ended on
      # #251 after 4 seconds, its first step still running in the
      # background, saying it would continue once that reported back
      # (#252, run 40359350311). Background tasks are now off and
      # claude_args tells it to finish in this run; this check stays as the
      # net. How it ended, its last message, goes in the log: that one only,
      # not show_full_output, which prints every tool's result in this
      # public repository's logs, as the action itself warns. The plugin
      # skips a pull request it has reviewed before, so the job fails only
      # when this one has no review from it at all.
      #
      # The action also skips, with a warning that workflow validation
      # failed, while this file differs from the default branch's, as on a
      # pull request that changes it (#247). It leaves no execution file
      # then, so the step compares the file with the default branch's
      # itself, and says so plainly.
      - name: A review is on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -f "$EXECUTION_FILE" ]; then
            jq -rs 'flatten | last | "Claude Code ended: \(.subtype // "unknown")\(if .is_error then ", as an error" else "" end). \(.result // "" | tostring | .[0:500])"' "$EXECUTION_FILE" || true
            # Each tool it was refused and what it asked for, not what it
            # got back: the count alone left #251's three unnamed (#252).
            jq -rs 'flatten | last | .permission_denials[]? | "Refused: \(.tool_name) \(.tool_input | tojson | .[0:160])"' "$EXECUTION_FILE" || true
          fi
          count=$( {
            gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --jq '.[] | select(.user.login == "claude[bot]") | .id'
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/comments" --jq '.[] | select(.user.login == "claude[bot]") | .id'
          } | wc -l)
          if [ "$count" -eq 0 ]; then
            # This file's path: the workflow's ref without the repository
            # before it or the ref after.
            workflow=${GITHUB_WORKFLOW_REF#"$GITHUB_REPOSITORY"/}
            workflow=${workflow%@*}
            main=$(gh api "repos/$GITHUB_REPOSITORY/contents/$workflow?ref=$DEFAULT_BRANCH" --jq .sha 2>/dev/null || true)
            if [ "$main" != "$(git hash-object "$workflow")" ]; then
              echo "::error title=No code review::Claude Code Review skipped this pull request because it changes the review's own workflow, $workflow, and the action runs only the one on $DEFAULT_BRANCH. The review runs once this workflow is on $DEFAULT_BRANCH; until then, review by hand (/code-review)."
            else
              echo "::error title=No code review::Claude Code Review ended without a review on this pull request: out of usage, it judged the change too simple to review, or it ended before its review had finished. The line above says how it ended. Re-run this job once it can, or review by hand (/code-review)."
            fi
            exit 1
          fi
          echo "claude[bot] has $count review comments on this pull request."

