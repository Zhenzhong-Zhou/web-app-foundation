name: CI

# Docs-only changes skip CI: prose cannot break the build, and the suites
# take minutes. A Markdown file anywhere counts as docs, except Help's
# guides, which ship in the client and are checked with it (ADR-079): the
# deploy follows CI on main (deploy.yml, ADR-081), so a guide changed
# alone would otherwise never go live. A later pattern overrides an
# earlier one.
on:
  push:
    branches: [main]
    paths: ['**', '!docs/**', '!**/*.md', 'client/src/help/guides/**']
  pull_request:
    # labeled, so adding full-e2e to a pull request runs every browser on it
    # without another push.
    types: [opened, synchronize, reopened, labeled]
    paths: ['**', '!docs/**', '!**/*.md', 'client/src/help/guides/**']
  # Every browser nightly, so a WebKit, Firefox or iPhone regression from a
  # day of merges shows the next morning rather than at the next release.
  schedule:
    - cron: '0 9 * * *' # 2am in Vancouver
  workflow_dispatch:

# On a pull request, a second push cancels the first: the suites take
# minutes and nobody reads the result of a commit that has been replaced.
# On main, a run in progress is never cancelled: a newer one waits for it
# to finish, so a run that starts gives its commit a verdict, which is what
# shows which merge broke main. GitHub keeps one run waiting, though: a
# newer push cancels a run still waiting, so of several merges in quick
# succession the middle ones get no run of their own, and only the newest
# is checked and deployed (deploy.yml). Before tagging a release, its
# commit's run must be there and green.
# Adding any other label gets a group of its own, so it cannot cancel a run
# in progress; its jobs are then skipped (each job's `if`).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'full-e2e' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every browser on main, nightly, by hand, and on a pull request labelled
# full-e2e (layout, mobile, sign-in: anything an engine could render or
# handle differently). Other pull requests run Chromium only.
env:
  FULL_E2E: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-e2e') }}

# Reads the repository and uploads artifacts, which needs nothing more
# (CodeQL: a workflow without permissions gets the token's defaults).
permissions:
  contents: read

jobs:
  client:
    name: Client — lint, types, unit
    if: github.event.action != 'labeled' || github.event.label.name == 'full-e2e'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Pinned to the major rather than .node-version: setup-node fails hard
      # when an exact patch is not yet on the runner, and it fails in seconds
      # with an error that looks like a config problem.
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          check-latest: true
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci
        working-directory: client

      # lint:ci, not lint: the local script runs eslint --fix and prettier
      # --write, which in CI rewrites files and then reports success — a
      # failing lint becoming a silent pass.
      - run: npm run lint:ci
        working-directory: client

      # The catalogues against the code and each other (ADR-054): a message
      # never extracted, a translation missing, or a placeholder renamed.
      - run: npm run i18n:check
        working-directory: client

      - run: npm run format:check
        working-directory: client

      - run: npx tsc --noEmit
        working-directory: client

      - run: npm run build
        working-directory: client

      - run: npm test
        working-directory: client

  server:
    name: Server — lint, build, integration
    if: github.event.action != 'labeled' || github.event.label.name == 'full-e2e'
    runs-on: ubuntu-24.04

    services:
      postgres:
        # Matches docker-compose. uuidv7() is native in 18 and absent in 17,
        # so an older image fails at the first insert rather than at startup.
        image: postgres:18-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: foundation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d foundation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          check-latest: true
          cache: npm
          # The client's too: the API contract step installs it (ADR-068).
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      # The two extra databases the service container does not create. They are
      # separate so that a server e2e run cannot truncate tables underneath a
      # browser run — the same reasoning .env.example gives.
      - name: Create test databases
        env:
          PGPASSWORD: ci_password
        run: |
          createdb -h localhost -U app foundation_test
          createdb -h localhost -U app foundation_e2e

      # Written at the repo root because that is where Docker Compose, NestJS,
      # and playwright.config.ts all look for it.
      - name: Write .env
        run: |
          cat > .env <<'ENVFILE'
          NODE_ENV=test
          PORT=3000
          APP_URL=http://localhost:3000
          CLIENT_URL=http://localhost:5173
          POSTGRES_USER=app
          POSTGRES_PASSWORD=ci_password
          POSTGRES_DB=foundation
          DATABASE_URL=postgresql://app:ci_password@localhost:5432/foundation
          DATABASE_URL_TEST=postgresql://app:ci_password@localhost:5432/foundation_test
          DATABASE_URL_E2E=postgresql://app:ci_password@localhost:5432/foundation_e2e
          SESSION_MAX_AGE_MS=2592000000
          SESSION_IDLE_MS=604800000
          VERIFICATION_TOKEN_TTL_MS=86400000
          PASSWORD_RESET_TOKEN_TTL_MS=3600000
          MAIL_HOST=localhost
          MAIL_PORT=1025
          MAIL_SECURE=false
          MAIL_FROM="Panivo <no-reply@localhost>"
          RATE_LIMIT_TTL_SECONDS=60
          RATE_LIMIT_MAX=1000
          RATE_LIMIT_AUTH_MAX=1000
          THROTTLE_FACTOR=100
          ENVFILE

      - run: npm ci
        working-directory: server

      - run: npm run lint:ci
        working-directory: server

      - run: npm run format:check
        working-directory: server

      # The source, the tests and perf/: build reads tsconfig.build.json,
      # which leaves the tests and perf/ out, so a type error in either
      # showed only when it ran.
      - run: npm run typecheck
        working-directory: server

      - run: npm run build
        working-directory: server

      # The unit project: the specs beside their source, and perf/'s
      # verdict. scripts/verify.sh has always run it; this job ran only the
      # e2e suite until ADR-082's branch. The job keeps its name, which the
      # required checks know it by.
      - run: npm test
        working-directory: server

      # Catches a hand-edited migration whose snapshot was never regenerated.
      # Locally this only runs for whoever generates; here it runs for everyone.
      - name: Check migration snapshots
        run: node scripts/check-snapshots.js
        working-directory: server

      # The API's contract and the client's types generated from it
      # (ADR-068): an API change committed without `npm run api` fails here,
      # where the client's copies of the shared lists used to be checked.
      # Whether a change breaks an open tab is the against-main job's.
      - name: Check the API contract
        run: |
          npm run api:spec
          npm ci --prefix ../client
          npm --prefix ../client run api:types
          git status --porcelain -- openapi.json ../client/src/api
          test -z "$(git status --porcelain -- openapi.json ../client/src/api)"
        working-directory: server

      # The server's own catalogues against its t() calls (ADR-054).
      - name: Check server catalogues
        run: npm run i18n:check
        working-directory: server

      # The tests of scripts/ itself, on Node's runner, since neither
      # package's Vitest finds them. Here, where both packages are
      # installed: i18n-review.mjs uses each one's FormatJS.
      - name: Test the repository's scripts
        run: node --test scripts/

      # From an empty database every time, which is the path production takes
      # and the one that rarely gets exercised locally.
      - name: Migrate
        run: |
          npm run migrate
          npm run migrate:test
          npm run migrate:e2e
        working-directory: server

      - run: npm run seed
        working-directory: server

      # The demo seed drives most services end to end: a purchase, a run, a
      # sale from a price list, an invoice, a return. Run here, a change that
      # breaks it fails the build rather than the next walkthrough.
      - run: npm run seed:demo
        working-directory: server

      - run: npm run test:e2e
        working-directory: server

  # Two checks of a pull request against main (ADR-081), in scripts that
  # scripts/verify.sh runs too: a breaking API change must raise
  # API_REVISION, and each new migration must leave working what the
  # release still serving reads. A job of its own, so neither waits behind
  # the server's suites.
  against-main:
    name: Against main — API revision, migrations
    if: github.event_name == 'pull_request' && (github.event.action != 'labeled' || github.event.label.name == 'full-e2e')
    runs-on: ubuntu-24.04
    steps:
      # A pull request checks out its merge into main. The merge's first
      # parent, HEAD^1, is main as the change merges into it, which both
      # scripts compare with.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # Node reads the documents' versions, and npx runs squawk.
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          check-latest: true

      # oasdiff, from a pinned container image.
      - name: A breaking API change raises the revision
        run: scripts/check-api-breaking.sh HEAD^1

      # squawk, at a pinned version, with server/.squawk.toml's rules.
      - name: New migrations leave the running release working
        run: scripts/check-migrations.sh HEAD^1

  # Three machines, each a third of the suite (--shard). No `needs`: it
  # starts beside the other two instead of after them, which took the
  # longest path from about 10 minutes to the slowest of the three jobs.
  # A lint failure still fails the run; the browsers just do not wait for it.
  browser:
    name: Client — Playwright ${{ matrix.shard }}/3
    if: github.event.action != 'labeled' || github.event.label.name == 'full-e2e'
    runs-on: ubuntu-24.04
    # A shard takes 5 to 8 minutes with every browser. This ends one that
    # stalls long before GitHub's default of 6 hours, with room for Install
    # browsers' three tries.
    timeout-minutes: 45
    strategy:
      # One shard failing must not cancel the others: their failures are
      # different tests, and all of them are wanted at once.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: foundation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d foundation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # The mail server the dev stack has (docker-compose.yml). A flow
      # that waits for its email, as a reset request does, fails without
      # one, since a reset whose email could not be sent says so rather
      # than claiming it went (AuthService.requestPasswordReset).
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          # Its HTTP API, which e2e/support/mail.ts reads the mail back
          # from: a verification link, an invitation.
          - 8025:8025

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          check-latest: true
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Create e2e database
        env:
          PGPASSWORD: ci_password
        run: createdb -h localhost -U app foundation_e2e

      - name: Write .env
        run: |
          cat > .env <<'ENVFILE'
          NODE_ENV=test
          PORT=3100
          APP_URL=http://localhost:3100
          CLIENT_URL=http://localhost:5273
          POSTGRES_USER=app
          POSTGRES_PASSWORD=ci_password
          POSTGRES_DB=foundation
          DATABASE_URL=postgresql://app:ci_password@localhost:5432/foundation_e2e
          DATABASE_URL_TEST=postgresql://app:ci_password@localhost:5432/foundation_e2e
          DATABASE_URL_E2E=postgresql://app:ci_password@localhost:5432/foundation_e2e
          SESSION_MAX_AGE_MS=2592000000
          SESSION_IDLE_MS=604800000
          VERIFICATION_TOKEN_TTL_MS=86400000
          PASSWORD_RESET_TOKEN_TTL_MS=3600000
          MAIL_HOST=localhost
          MAIL_PORT=1025
          MAIL_SECURE=false
          MAIL_FROM="Panivo <no-reply@localhost>"
          RATE_LIMIT_TTL_SECONDS=60
          RATE_LIMIT_MAX=1000
          RATE_LIMIT_AUTH_MAX=1000
          THROTTLE_FACTOR=100
          ENVFILE

      # The server tree too: playwright.config.ts starts the API itself with
      # `npm run start:dev`, and pretest:e2e runs drizzle-kit from there.
      - run: npm ci
        working-directory: server

      - run: npm ci
        working-directory: client

      # Chromium for the suite; WebKit (Safari, iPhone) and Firefox for the
      # projects that check every screen in each (playwright.config.ts), only
      # when they run.
      #
      # What stalls is apt fetching the browsers' Linux packages (181
      # packages, 119 MB, with every browser), not the browsers, which
      # download in seconds, so caching the browsers would not help. On
      # #251's runs and the scheduled one of 26 October, a shard fetched
      # them from azure.archive.ubuntu.com at about 40 kB/s: still going
      # when cancelled after 20 and 27 minutes, or 49 to finish, where the
      # other shards took about one. The runner image's own apt settings
      # (/etc/apt/apt.conf.d/zz-retries: a 15-second timeout and one retry,
      # then the next mirror) are the first defence, but they catch a
      # mirror gone silent, not one crawling. Each try's 5 minutes, about
      # twice the slowest healthy install, are the guarantee: a stall ends
      # the try, not the job. Before a retry, the try's apt-get is stopped,
      # dpkg finishes an install cut off mid-way, and the Azure mirror
      # leaves apt's list, so the retry fetches from archive.ubuntu.com,
      # the image's next, keeping the packages already fetched. If stalls
      # continue, Playwright's Docker image is the heavier fix, though this
      # job starts containers of its own (the services above).
      - name: Install browsers
        # A backstop: three tries of 5 minutes, and the pauses between.
        timeout-minutes: 17
        run: |
          browsers=(chromium)
          if [ "$FULL_E2E" = true ]; then
            browsers+=(webkit firefox)
          fi
          for try in 1 2 3; do
            if [ "$try" -gt 1 ]; then
              # The try's apt-get runs under sudo, in a session of its
              # own, and can outlive timeout's signal: on #254's first
              # run it went on fetching, holding dpkg's lock.
              sudo pkill -KILL -x apt-get || true
              while pgrep -x 'apt-get|dpkg' > /dev/null; do sleep 1; done
              sudo dpkg --configure -a
              sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
              sleep 10
            fi
            timeout --kill-after=20s 5m npx playwright install --with-deps "${browsers[@]}" && exit 0
            status=$?
            if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
              echo "::warning title=Install browsers::Try $try of 3 timed out after 5 minutes."
            else
              echo "::warning title=Install browsers::Try $try of 3 failed, exit code $status."
            fi
          done
          exit 1
        working-directory: client

      # One script, not four steps. pretest:e2e already migrates and seeds
      # against DATABASE_URL_E2E through dotenv-cli, and test:e2e wraps
      # playwright in the same loader — reimplementing either here would be a
      # second definition of the setup, free to drift from the one people run.
      - name: Playwright, shard ${{ matrix.shard }} of 3
        env:
          SHARD: ${{ matrix.shard }}/3
        run: |
          if [ "$FULL_E2E" = true ]; then
            npm run test:e2e -- --shard="$SHARD"
          else
            npm run test:e2e -- --project=chromium --shard="$SHARD"
          fi
        working-directory: client

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: client/playwright-report/
          retention-days: 7