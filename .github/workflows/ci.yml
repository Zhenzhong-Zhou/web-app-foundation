name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the first. The suites take minutes
# and nobody reads the result of a commit that has already been replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Client — lint, types, unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned to the major rather than .node-version: setup-node fails hard
      # when an exact patch is not yet on the runner, and it fails in seconds
      # with an error that looks like a config problem.
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci
        working-directory: client

      # lint:ci, not lint: the local script runs eslint --fix and prettier
      # --write, which in CI rewrites files and then reports success — a
      # failing lint becoming a silent pass.
      - run: npm run lint:ci
        working-directory: client

      - run: npm run format:check
        working-directory: client

      - run: npx tsc --noEmit
        working-directory: client

      - run: npm run build
        working-directory: client

      - run: npm test
        working-directory: client

  server:
    name: Server — lint, build, integration
    runs-on: ubuntu-latest

    services:
      postgres:
        # Matches docker-compose. uuidv7() is native in 18 and absent in 17,
        # so an older image fails at the first insert rather than at startup.
        image: postgres:18-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: foundation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d foundation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: server/package-lock.json

      # The two extra databases the service container does not create. They are
      # separate so that a Jest run cannot truncate tables underneath a browser
      # run — the same reasoning .env.example gives.
      - name: Create test databases
        env:
          PGPASSWORD: ci_password
        run: |
          createdb -h localhost -U app foundation_test
          createdb -h localhost -U app foundation_e2e

      # Written at the repo root because that is where Docker Compose, NestJS,
      # and playwright.config.ts all look for it.
      - name: Write .env
        run: |
          cat > .env <<'ENVFILE'
          NODE_ENV=test
          PORT=3000
          APP_URL=http://localhost:3000
          CLIENT_URL=http://localhost:5173
          POSTGRES_USER=app
          POSTGRES_PASSWORD=ci_password
          POSTGRES_DB=foundation
          DATABASE_URL=postgresql://app:ci_password@localhost:5432/foundation
          DATABASE_URL_TEST=postgresql://app:ci_password@localhost:5432/foundation_test
          DATABASE_URL_E2E=postgresql://app:ci_password@localhost:5432/foundation_e2e
          SESSION_MAX_AGE_MS=2592000000
          SESSION_IDLE_MS=604800000
          VERIFICATION_TOKEN_TTL_MS=86400000
          PASSWORD_RESET_TOKEN_TTL_MS=3600000
          MAIL_HOST=localhost
          MAIL_PORT=1025
          MAIL_SECURE=false
          MAIL_FROM="Foundation <no-reply@localhost>"
          RATE_LIMIT_TTL_SECONDS=60
          RATE_LIMIT_MAX=1000
          RATE_LIMIT_AUTH_MAX=1000
          THROTTLE_FACTOR=100
          ENVFILE

      - run: npm ci
        working-directory: server

      - run: npm run lint:ci
        working-directory: server

      - run: npm run build
        working-directory: server

      # Catches a hand-edited migration whose snapshot was never regenerated.
      # Locally this only runs for whoever generates; here it runs for everyone.
      - name: Check migration snapshots
        run: node scripts/check-snapshots.js
        working-directory: server

      # From an empty database every time, which is the path production takes
      # and the one that rarely gets exercised locally.
      - name: Migrate
        run: |
          npm run migrate
          npm run migrate:test
          npm run migrate:e2e
        working-directory: server

      - run: npm run seed
        working-directory: server

      - run: npm run test:e2e
        working-directory: server

  browser:
    name: Client — Playwright
    runs-on: ubuntu-latest
    needs: [client, server]

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: foundation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d foundation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Create e2e database
        env:
          PGPASSWORD: ci_password
        run: createdb -h localhost -U app foundation_e2e

      - name: Write .env
        run: |
          cat > .env <<'ENVFILE'
          NODE_ENV=test
          PORT=3100
          APP_URL=http://localhost:3100
          CLIENT_URL=http://localhost:5273
          POSTGRES_USER=app
          POSTGRES_PASSWORD=ci_password
          POSTGRES_DB=foundation
          DATABASE_URL=postgresql://app:ci_password@localhost:5432/foundation_e2e
          DATABASE_URL_TEST=postgresql://app:ci_password@localhost:5432/foundation_e2e
          DATABASE_URL_E2E=postgresql://app:ci_password@localhost:5432/foundation_e2e
          SESSION_MAX_AGE_MS=2592000000
          SESSION_IDLE_MS=604800000
          VERIFICATION_TOKEN_TTL_MS=86400000
          PASSWORD_RESET_TOKEN_TTL_MS=3600000
          MAIL_HOST=localhost
          MAIL_PORT=1025
          MAIL_SECURE=false
          MAIL_FROM="Foundation <no-reply@localhost>"
          RATE_LIMIT_TTL_SECONDS=60
          RATE_LIMIT_MAX=1000
          RATE_LIMIT_AUTH_MAX=1000
          THROTTLE_FACTOR=100
          ENVFILE

      # The server tree too: playwright.config.ts starts the API itself with
      # `npm run start:dev`, and pretest:e2e runs drizzle-kit from there.
      - run: npm ci
        working-directory: server

      - run: npm ci
        working-directory: client

      - name: Install browsers
        run: npx playwright install --with-deps chromium
        working-directory: client

      # One script, not four steps. pretest:e2e already migrates and seeds
      # against DATABASE_URL_E2E through dotenv-cli, and test:e2e wraps
      # playwright in the same loader — reimplementing either here would be a
      # second definition of the setup, free to drift from the one people run.
      - run: npm run test:e2e
        working-directory: client

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 7