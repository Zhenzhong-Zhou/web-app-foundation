name: Docs

# Markdown gets its own workflow because CI skips docs-only changes
# (ci.yml's paths): a check inside ci.yml would never run on the
# pull requests that need it. This one runs on every push and pull request,
# not on Markdown changes alone: renaming a test or a guide can break a link
# from a Markdown file (ADR-086). It takes seconds.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch cancels the first, as in ci.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Reads the repository and nothing else.
permissions:
  contents: read

jobs:
  markdown:
    name: Docs — markdownlint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          check-latest: true

      # The same version and the same .markdownlint-cli2.jsonc as the editor
      # and a local run, so all three give the same answer. scripts/verify.sh
      # pins it too: change both together. Pinned: a new markdownlint release
      # can add a rule, and that should arrive as a change here rather than
      # as a red build on an unrelated pull request.
      - run: npx --yes markdownlint-cli2@0.23.3

      # Every relative link in the Markdown leads to a file, and a fragment
      # to a heading there, which markdownlint checks within one file only
      # (ADR-086). Node and git, nothing to install.
      - run: node scripts/check-docs.mjs
