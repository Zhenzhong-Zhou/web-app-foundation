name: Docs

# Markdown gets its own workflow because CI skips docs-only changes
# (ci.yml's paths): a check inside ci.yml would never run on the
# pull requests that need it. This one runs on every pull request, and every
# push to main, not on Markdown changes alone: renaming a test or a guide can
# break a link from a Markdown file (ADR-086). It takes seconds.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch cancels the first, as in ci.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Reads the repository and nothing else.
permissions:
  contents: read

jobs:
  markdown:
    name: Docs — markdownlint
    runs-on: ubuntu-24.04
    steps:
      # A pull request checks out its merge into main. Two commits deep, so
      # the merge's first parent, HEAD^1, is there: main as the change
      # merges into it, as in ci.yml's against-main job.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # check-docs.mjs's notice compares with origin/main, which a pull
      # request's checkout does not name: HEAD^1 is that base.
      - name: The base the notice compares with
        if: github.event_name == 'pull_request'
        run: git update-ref refs/remotes/origin/main HEAD^1

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          check-latest: true

      # The same version and the same .markdownlint-cli2.jsonc as the editor
      # and a local run, so all three give the same answer. scripts/verify.sh
      # pins it too: change both together. Pinned: a new markdownlint release
      # can add a rule, and that should arrive as a change here rather than
      # as a red build on an unrelated pull request.
      - run: npx --yes markdownlint-cli2@0.23.3

      # What markdownlint cannot see, as scripts/check-docs.mjs's header
      # lists it: the links between files, the ADRs and their index
      # (ADR-086), and the rules files, with a notice that never fails
      # (ADR-087). Node and git, nothing to install.
      - run: node scripts/check-docs.mjs

      # The chat's planning skill, checked as claude.ai checks an upload
      # (ADR-088). Its test runs in ci.yml, which skips a change of
      # Markdown alone, as a change of the skill often is. Node and git.
      - run: node scripts/pack-chat-skill.mjs --check
