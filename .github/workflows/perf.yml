name: Performance

# ADR-051, amended (CI speed-up). Three modes:
#
# - plans: seed, then the plan check (EXPLAIN on the main reads). It is
#   deterministic, so it can gate a pull request, and it caught both real
#   problems so far. On every pull request that changes the server's code.
# - budgets: plans, plus the response-time budgets and the concurrency check
#   at 10 connections. By hand, on a branch whose speed is in question.
# - full: budgets, plus the 100-connection stress pass. Weekly on main, on
#   each release candidate tag (so before every release), and by hand.
#
# Timings on shared runners are too noisy to gate a merge, so only by hand
# do budgets run on a branch: Actions → Performance → Run workflow.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: What to run
        type: choice
        options: [full, budgets, plans]
        default: full
      scale:
        description: Volume to seed (large takes hours)
        type: choice
        options: [small, large]
        default: small
      organizations:
        description: Organizations to seed
        type: number
        default: 5
  pull_request:
    paths:
      - 'server/src/**'
      - 'server/perf/**'
      - '.github/workflows/perf.yml'
      - '!server/src/**/*.spec.ts'
  push:
    tags: ['v*-rc.*']
  schedule:
    - cron: '0 11 * * 1' # Mondays, 4am in Vancouver

# Timed runs one at a time: two runs on one account's runners would measure
# each other. A pull request's plan check times nothing, so it has a group
# per branch, and a newer push replaces it.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('performance-plans-{0}', github.ref) || 'performance' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  perf:
    name: Performance, ${{ inputs.mode || (github.event_name == 'pull_request' && 'plans') || 'full' }}
    # Pinned, unlike ci.yml: these numbers are compared across runs, and a
    # runner image changing underneath (ubuntu-latest moves to 26 on
    # 19 October 2026) would make two runs incomparable.
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.scale == 'large' && 350 || 90 }}

    # One place for what this run does. Inputs only exist when run by hand.
    env:
      MODE: ${{ inputs.mode || (github.event_name == 'pull_request' && 'plans') || 'full' }}
      SCALE: ${{ inputs.scale || 'small' }}
      ORGANIZATIONS: ${{ inputs.organizations || 5 }}

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: foundation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d foundation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: server/package-lock.json

      # NODE_ENV=test for silent logs, as perf/README.md explains; in test
      # mode the server and scripts read DATABASE_URL_TEST, so every URL
      # points at the one database. The rate limit is raised so the numbers
      # measure the app, not the limiter.
      - name: Write .env
        working-directory: .
        run: |
          cat > .env <<'ENVFILE'
          NODE_ENV=test
          PORT=3000
          APP_URL=http://localhost:3000
          CLIENT_URL=http://localhost:5173
          POSTGRES_USER=app
          POSTGRES_PASSWORD=ci_password
          POSTGRES_DB=foundation
          DATABASE_URL=postgresql://app:ci_password@localhost:5432/foundation
          DATABASE_URL_TEST=postgresql://app:ci_password@localhost:5432/foundation
          DATABASE_URL_E2E=postgresql://app:ci_password@localhost:5432/foundation
          SESSION_MAX_AGE_MS=2592000000
          SESSION_IDLE_MS=604800000
          VERIFICATION_TOKEN_TTL_MS=86400000
          PASSWORD_RESET_TOKEN_TTL_MS=3600000
          MAIL_HOST=localhost
          MAIL_PORT=1025
          MAIL_SECURE=false
          MAIL_FROM="Foundation <no-reply@localhost>"
          RATE_LIMIT_TTL_SECONDS=60
          RATE_LIMIT_MAX=1000000
          RATE_LIMIT_AUTH_MAX=1000
          THROTTLE_FACTOR=100
          ENVFILE

      - run: npm ci

      - run: npm run build

      # Seeding the volume is half of a run (11m 48s of 22m 48s). The volume
      # depends on the seed's own code, so that is the cache key; each save
      # adds the run id, and a restore takes the newest.
      - name: Volume cache key
        id: key
        run: echo "prefix=perf-volume-$SCALE-$ORGANIZATIONS-${{ hashFiles('server/src/database/seed-volume.ts', 'server/src/database/volume/**') }}-" >> "$GITHUB_OUTPUT"

      # Plans only: the volume from the last seed on main. Written by older
      # services and migrated forward by the next step, which is what a
      # production database is, and plans do not depend on when it was
      # written. Timed runs always seed fresh, so their numbers compare.
      - name: Restore the volume
        id: volume
        if: env.MODE == 'plans'
        uses: actions/cache/restore@v6
        with:
          path: |
            server/perf/volume.dump
            server/perf/volume.json
          key: ${{ steps.key.outputs.prefix }}${{ github.run_id }}
          restore-keys: ${{ steps.key.outputs.prefix }}

      # Inside the service container, so pg_restore is Postgres 18's own;
      # the runner's client tools are older than the server.
      - name: Load the volume
        if: steps.volume.outputs.cache-matched-key != ''
        env:
          PG: ${{ job.services.postgres.id }}
        run: |
          docker exec -i "$PG" pg_restore -U app -d foundation --no-owner --no-privileges --exit-on-error < perf/volume.dump
          docker exec "$PG" psql -U app -d foundation -c 'analyze'

      - run: npm run migrate

      - run: npm run seed

      # Inputs through env, not pasted into the script, so a value is never
      # read as shell.
      - name: Seed volume
        if: steps.volume.outputs.cache-matched-key == ''
        run: npm run seed:volume -- --scale "$SCALE" --organizations "$ORGANIZATIONS"

      # A fresh small volume on main is kept for the pull requests after it,
      # dumped before anything below writes to it. The weekly run renews it.
      - name: Dump the volume
        if: steps.volume.outputs.cache-matched-key == '' && github.ref == 'refs/heads/main' && env.SCALE == 'small'
        env:
          PG: ${{ job.services.postgres.id }}
        run: docker exec "$PG" pg_dump -U app -d foundation -Fc --no-owner --no-privileges > perf/volume.dump

      - name: Keep the volume
        if: steps.volume.outputs.cache-matched-key == '' && github.ref == 'refs/heads/main' && env.SCALE == 'small'
        uses: actions/cache/save@v6
        with:
          path: |
            server/perf/volume.dump
            server/perf/volume.json
          key: ${{ steps.key.outputs.prefix }}${{ github.run_id }}

      # The built server, as production runs it, in the background.
      - name: Start the server
        if: env.MODE != 'plans'
        run: |
          node dist/main > server.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://localhost:3000/health/ready > /dev/null && exit 0
            sleep 1
          done
          cat server.log
          exit 1

      # The stress pass sends three times the budget pass's requests, at 100
      # connections, and never fails: most of this step's ten minutes, so it
      # is the full run's alone.
      - name: Budgets, concurrency, stress
        id: perf
        if: env.MODE != 'plans'
        run: |
          if [ "$MODE" = budgets ]; then
            npm run perf -- --skip-stress
          else
            npm run perf
          fi

      # Runs even when a budget failed: the plans are often why.
      - name: Query plans
        if: success() || steps.perf.outcome == 'failure'
        run: npm run perf:plans

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: perf-${{ env.MODE }}-${{ env.SCALE }}-${{ github.run_number }}
          path: |
            server/perf/reports/
            server/server.log
          retention-days: 30
