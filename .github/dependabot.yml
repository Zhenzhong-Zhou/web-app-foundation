version: 2

updates:
  # Two npm entries, not one: server and client have separate package.json
  # files rather than npm workspaces, so Dependabot has to be pointed at each.
  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Version updates only once a release is 7 days old, as the dependency
    # rule asks (docs/conventions.md, Dependencies; ADR-081). Security
    # updates are not delayed.
    cooldown:
      default-days: 7
    # Grouped, because twenty single-package PRs a week is a volume people
    # learn to ignore — and an ignored security PR is worse than none.
    groups:
      nest:
        patterns:
          - '@nestjs/*'
      types:
        patterns:
          - '@types/*'
      dev-minor:
        dependency-type: development
        update-types:
          - minor
          - patch
      prod-minor:
        dependency-type: production
        update-types:
          - minor
          - patch
    ignore:
      # Majors land as their own PR when someone has time to read the
      # changelog, not on a Monday alongside eleven others.
      - dependency-name: '*'
        update-types: [version-update:semver-major]
      # 30.1.0 hands focus events a Document as relatedTarget once the focused
      # element is removed; MUI's FocusTrap stores it and calls .focus() on it
      # at unmount, so every dialog spec after the first throws.
      # jsdom/jsdom#4345, mui/material-ui#49159. Version-pinned, not a blanket
      # ignore, so the release carrying the fix still arrives on its own.
      - dependency-name: 'jsdom'
        versions: ['30.1.0']

  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      mui:
        patterns:
          - '@mui/*'
      types:
        patterns:
          - '@types/*'
      dev-minor:
        dependency-type: development
        update-types:
          - minor
          - patch
      prod-minor:
        dependency-type: production
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]

  # The fix runner's own package (ADR-089's amendment): the Agent SDK,
  # pinned exactly, which publishes every one to four days, so monthly,
  # and each raise proved by the runner's --probe. Nothing the app ships
  # depends on it, so a branch's dependency step leaves it to this.
  # Minors are ignored too: the SDK is 0.x, where 0.3 to 0.4 is a minor
  # that may break, and CI never loads the SDK, so its pull request would
  # pass whatever it broke. A 0.x minor is taken by hand, with --probe
  # before the merge.
  - package-ecosystem: npm
    directory: /scripts/fix-issue
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '*'
        update-types:
          [version-update:semver-major, version-update:semver-minor]

  # Actions pinned by major tag still drift, and a deprecated runner image
  # fails every workflow at once with an error that names nothing useful.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7